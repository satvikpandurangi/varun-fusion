version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: varun_postgis
    environment:
      POSTGRES_DB: varun_fusion
      POSTGRES_USER: varun
      POSTGRES_PASSWORD: varun_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varun -d varun_fusion"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: varun_backend
    environment:
      DATABASE_URL: postgresql://varun:varun_secure_password@db:5432/varun_fusion
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: varun_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
